<div class="tm-header">
  <span class="tm-icon-wrap">
    <mat-icon>edit</mat-icon>
  </span>
  <div class="tm-title-col">
    <span class="tm-eyebrow">Task</span>
    <span class="tm-title">Edit task #{{ id }}</span>
  </div>
  <button class="tm-close" mat-dialog-close>
    <mat-icon>close</mat-icon>
  </button>
</div>

<mat-dialog-content>
  <form id="editTaskForm" class="tm-body" [formGroup]="form" (ngSubmit)="submit()">
    <div class="tm-field">
      <label class="tm-label">
        Title
        <span class="tm-req">*</span>
      </label>
      <input class="tm-input" [formControl]="title" />
      @if (title.touched && title.hasError('required')) {
        <span class="tm-error">Title is required</span>
      }
    </div>
    <div class="tm-field">
      <label class="tm-label">Description</label>
      <textarea class="tm-textarea" rows="3" [formControl]="description"></textarea>
    </div>
    <div class="tm-field">
      <label class="tm-label">Status</label>
      <div class="tm-status-row">
        @for (s of statuses; track s) {
          <button class="tm-status-btn" type="button" [class.active]="status.value === s" (click)="status.setValue(s)">
            <span class="tm-status-dot" [style.background]="statusDot(s)"></span>
            {{ statusLabel(s) }}
          </button>
        }
      </div>
    </div>
    <div class="tm-field-row" style="grid-template-columns: 1fr 1fr 1fr">
      <div class="tm-field">
        <label class="tm-label">ID</label>
        <input class="tm-input-ro" readonly [value]="'#' + id" />
      </div>
      <div class="tm-field">
        <label class="tm-label">Created</label>
        <input class="tm-input-ro" readonly [value]="createdAt | date: 'dd MMM yyyy, HH:mm'" />
      </div>
      <div class="tm-field">
        <label class="tm-label">Updated</label>
        <input class="tm-input-ro" readonly [value]="updatedAt | date: 'dd MMM yyyy, HH:mm'" />
      </div>
    </div>
  </form>
</mat-dialog-content>

<div class="tm-footer">
  <button class="tm-btn-ghost" (click)="cancel()">Cancel</button>
  <button class="tm-btn-primary" form="editTaskForm" type="submit">Save changes</button>
</div>
