<div class="tm-header">
  <span class="tm-icon-wrap">
    <mat-icon>add</mat-icon>
  </span>
  <div class="tm-title-col">
    <span class="tm-eyebrow">Task</span>
    <span class="tm-title">New task</span>
  </div>
  <button class="tm-close" mat-dialog-close>
    <mat-icon>close</mat-icon>
  </button>
</div>

<mat-dialog-content>
  <form id="createTaskForm" class="tm-body" [formGroup]="form" (ngSubmit)="submit()">
    <div class="tm-field">
      <label class="tm-label">
        Title
        <span class="tm-req">*</span>
      </label>
      <input class="tm-input" placeholder="Short, action-oriented title" [formControl]="title" />
      @if (title.touched && title.hasError('required')) {
        <span class="tm-error">Title is required</span>
      }
    </div>
    <div class="tm-field">
      <label class="tm-label">Description</label>
      <textarea class="tm-textarea" placeholder="Add detail, acceptance criteria, links…" rows="3" [formControl]="description"></textarea>
    </div>
  </form>
</mat-dialog-content>

<div class="tm-footer">
  <button class="tm-btn-ghost" (click)="cancel()">Cancel</button>
  <button class="tm-btn-primary" form="createTaskForm" type="submit">
    <mat-icon>add</mat-icon>
    Create task
  </button>
</div>
