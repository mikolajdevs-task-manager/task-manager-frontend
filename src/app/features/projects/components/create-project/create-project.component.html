<div class="tm-header">
  <span class="tm-icon-wrap">
    <mat-icon>folder</mat-icon>
  </span>
  <div class="tm-title-col">
    <span class="tm-eyebrow">Project</span>
    <span class="tm-title">New project</span>
  </div>
  <button class="tm-close" mat-dialog-close>
    <mat-icon>close</mat-icon>
  </button>
</div>

<mat-dialog-content>
  <form id="createProjectForm" class="tm-body" [formGroup]="form" (ngSubmit)="submit()">
    <div class="tm-field">
      <label class="tm-label">
        Name
        <span class="tm-req">*</span>
      </label>
      <input class="tm-input" placeholder="e.g. Dev Frontend" [formControl]="name" />
      @if (name.touched && name.hasError('required')) {
        <span class="tm-error">Name is required</span>
      }
    </div>
    <div class="tm-field">
      <label class="tm-label">Description</label>
      <textarea class="tm-textarea" placeholder="What's this project about?" rows="3" [formControl]="description"></textarea>
    </div>
  </form>
</mat-dialog-content>

<div class="tm-footer">
  <button class="tm-btn-ghost" (click)="cancel()">Cancel</button>
  <button class="tm-btn-primary" form="createProjectForm" type="submit">
    <mat-icon>add</mat-icon>
    Create project
  </button>
</div>
