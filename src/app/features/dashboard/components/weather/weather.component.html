<ng-container *ngIf="weather$ | async as weather">
  <mat-card class="weather-container" appearance="outlined" *ngIf="alertState | async">
    <div class="weather-details">
      <span>{{ 'Current weather at ' + weather.location + ': ' }}</span>
      <span>{{ weather.temp + '°C, ' + (weather.description | lowercase) }}</span>
    </div>
    <button mat-icon-button (click)="close()">
      <mat-icon>close</mat-icon>
    </button>
  </mat-card>
</ng-container>
