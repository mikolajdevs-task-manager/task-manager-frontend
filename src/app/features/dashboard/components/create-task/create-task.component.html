<mat-card appearance="outlined" class="form-card">
  <mat-card-header>
    <mat-card-title>Create new task</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <form [formGroup]="form">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Title</mat-label>
        <input matInput [formControl]="title"/>
      </mat-form-field>
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Description</mat-label>
        <input matInput [formControl]="description"/>
      </mat-form-field>
    </form>
  </mat-card-content>
  <mat-card-actions>
    <button mat-flat-button class="app-btn" (click)="create()">Create</button>
  </mat-card-actions>
</mat-card>
