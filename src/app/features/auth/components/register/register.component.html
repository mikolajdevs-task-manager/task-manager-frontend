<mat-card appearance="outlined" class="form-card">
  <mat-card-header>
    <mat-card-title>Create new account</mat-card-title>
  </mat-card-header>

  <mat-card-content>
    <form [formGroup]="form">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Email</mat-label>
        <input [formControl]="email" matInput required type="email"/>
        <mat-error *ngIf="email?.hasError('emailTaken')">
          This email is already registered
        </mat-error>
      </mat-form-field>
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Password</mat-label>
        <input [formControl]="password" matInput required type="password"/>
      </mat-form-field>
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Confirm Password</mat-label>
        <input [formControl]="password2" matInput required type="password"/>
        <mat-error *ngIf="password2.errors?.['passwordsMismatch']">
          Passwords do not match
        </mat-error>
      </mat-form-field>
    </form>
  </mat-card-content>
  <mat-card-actions>
    <button mat-button (click)="authFormStateChange.emit(AuthFormState.LOGIN)">Back to login</button>
    <button mat-flat-button color="primary" (click)="submit()">Register</button>
  </mat-card-actions>
</mat-card>
