<mat-card class="form-card" appearance="outlined">
  <mat-card-header>
    <mat-card-title>Create new account</mat-card-title>
  </mat-card-header>

  <mat-card-content>
    <form [formGroup]="form">
      <mat-form-field class="full-width" appearance="outline">
        <mat-label>Email</mat-label>
        <input matInput required type="email" [formControl]="email" />
        <mat-error *ngIf="email?.hasError('emailTaken')">This email is already registered</mat-error>
      </mat-form-field>
      <mat-form-field class="full-width" appearance="outline">
        <mat-label>Password</mat-label>
        <input matInput required type="password" [formControl]="password" />
      </mat-form-field>
      <mat-form-field class="full-width" appearance="outline">
        <mat-label>Confirm Password</mat-label>
        <input matInput required type="password" [formControl]="password2" />
        <mat-error *ngIf="password2.errors?.['passwordsMismatch']">Passwords do not match</mat-error>
      </mat-form-field>
    </form>
  </mat-card-content>
  <mat-card-actions>
    <button mat-button (click)="authFormStateChange.emit(AuthFormState.LOGIN)">Back to login</button>
    <button color="primary" mat-flat-button (click)="submit()">Register</button>
  </mat-card-actions>
</mat-card>
