<mat-card class="form-card" appearance="outlined">
  <mat-card-header>
    <mat-card-title>Create new account</mat-card-title>
  </mat-card-header>

  <mat-card-content>
    <form [formGroup]="form">
      <mat-form-field class="full-width" appearance="outline">
        <mat-label>{{ 'auth.common.email' | translate }}</mat-label>
        <input matInput required type="email" [formControl]="email" />
        <mat-error *ngIf="email?.hasError('emailTaken')">
          {{ 'auth.signUp.error.emailTaken' | translate }}
        </mat-error>
      </mat-form-field>
      <mat-form-field class="full-width" appearance="outline">
        <mat-label>{{ 'auth.common.password' | translate }}</mat-label>
        <input matInput required type="password" [formControl]="password" />
      </mat-form-field>
      <mat-form-field class="full-width" appearance="outline">
        <mat-label>{{ 'auth.signUp.confirmPassword' | translate }}</mat-label>
        <input matInput required type="password" [formControl]="password2" />
        <mat-error *ngIf="password2.errors?.['passwordsMismatch']">
          {{ 'auth.signUp.error.passwordsMismatch' | translate }}
        </mat-error>
      </mat-form-field>
    </form>
  </mat-card-content>
  <mat-card-actions>
    <button mat-button (click)="authFormStateChange.emit(AuthFormState.LOGIN)">
      {{ 'auth.signUp.backToLogin' | translate }}
    </button>
    <button color="primary" mat-flat-button (click)="submit()">
      {{ 'auth.signUp.register' | translate }}
    </button>
  </mat-card-actions>
</mat-card>
