<mat-card class="form-card" appearance="outlined">
  <mat-card-header>
    <mat-card-title>Login</mat-card-title>
  </mat-card-header>

  <mat-card-content>
    <form [formGroup]="form">
      <mat-form-field class="full-width" appearance="outline">
        <mat-label>Email</mat-label>
        <input matInput required type="email" [formControl]="email" />
      </mat-form-field>
      <mat-form-field class="full-width" appearance="outline">
        <mat-label>Password</mat-label>
        <input matInput required type="password" [formControl]="password" />
      </mat-form-field>
    </form>
  </mat-card-content>
  <mat-card-actions>
    <button mat-button (click)="authFormStateChange.emit(AuthFormState.REGISTER)">Sign up</button>
    <button color="primary" mat-flat-button (click)="submit()">Login</button>
  </mat-card-actions>
</mat-card>
