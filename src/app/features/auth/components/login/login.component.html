<mat-card appearance="outlined" class="form-card">
  <mat-card-header>
    <mat-card-title>Login</mat-card-title>
  </mat-card-header>

  <mat-card-content>
    <form [formGroup]="form">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Email</mat-label>
        <input [formControl]="email" matInput required type="email"/>
      </mat-form-field>
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Password</mat-label>
        <input [formControl]="password" matInput required type="password"/>
      </mat-form-field>
    </form>
  </mat-card-content>
  <mat-card-actions>
    <button mat-button (click)="authFormStateChange.emit(AuthFormState.REGISTER)">Sign up</button>
    <button mat-flat-button color="primary" (click)="submit()">Login</button>
  </mat-card-actions>
</mat-card>
