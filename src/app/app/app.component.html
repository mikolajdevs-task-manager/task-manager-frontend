<header>
  <div class="container">
    <a href="/">
      <mat-icon aria-hidden="false" fontIcon="spa"></mat-icon>
      Goally
    </a>
    <ng-container *ngIf="user$ | async as user">
      <div class="user-details">
        <div class="user">
          <mat-icon aria-hidden="false" fontIcon="account_circle"></mat-icon>
          {{ user.email }}
        </div>
        <button (click)="authService.logout()" mat-icon-button>
          <mat-icon>logout</mat-icon>
        </button>
      </div>
    </ng-container>
  </div>
</header>
<div class="container-wrapper">
  <div class="container">
    <router-outlet></router-outlet>
  </div>
</div>
