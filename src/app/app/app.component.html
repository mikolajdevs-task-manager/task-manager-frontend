@if (isAuthenticated) {
  <div class="app-container">
    <app-sidenav
      [identityClaims]="identityClaims"
      [project]="project()"
      [projects]="projects()"
      [projectsLoading]="projectsLoading()"
      (logOut)="logOut()"
      (projectChange)="onProjectChange($event)"
      (projectCreate)="onProjectCreate()"
    ></app-sidenav>
    <div class="content">
      <router-outlet></router-outlet>
    </div>
  </div>
}
